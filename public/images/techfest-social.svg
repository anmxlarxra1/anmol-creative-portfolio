<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="100%" height="100%">
  <defs>
    <linearGradient id="socialBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a12"/>
      <stop offset="60%" stop-color="#11162b"/>
      <stop offset="100%" stop-color="#08080f"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#socialBg)"/>

  <!-- Top bar metadata -->
  <text x="80" y="110" fill="#38bdf8" font-family="'Space Mono', monospace" font-size="16" letter-spacing="4">TECHFEST 2026 // KEYNOTE SPEAKER</text>
  <text x="1000" y="110" text-anchor="end" fill="#64748b" font-family="'Space Mono', monospace" font-size="16">01 / 05</text>
  <line x1="80" y1="140" x2="1000" y2="140" stroke="#1e293b" stroke-width="2"/>

  <!-- Speaker Visual Frame -->
  <g transform="translate(80, 200)">
    <rect width="920" height="540" rx="24" fill="#13192e" stroke="#253259" stroke-width="2"/>
    
    <!-- Stylized Avatar / Abstract Waveform Graphic -->
    <circle cx="460" cy="270" r="160" fill="#1e294b" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="460" cy="270" r="110" fill="url(#neonCyan)" opacity="0.3"/>
    <!-- Abstract geometric icon -->
    <polygon points="460,190 530,320 390,320" fill="none" stroke="#ffffff" stroke-width="4"/>
    <circle cx="460" cy="280" r="24" fill="#38bdf8"/>
    
    <!-- Overlay badge -->
    <rect x="50" y="450" width="220" height="50" rx="25" fill="#090a12" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="482" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16">AI ARCHITECT</text>
  </g>

  <!-- Big Editorial Speaker Name -->
  <g transform="translate(80, 810)">
    <text x="0" y="60" fill="#ffffff" font-family="'Syne', sans-serif" font-weight="800" font-size="76" letter-spacing="-2">SARAH LIN</text>
    <text x="0" y="110" fill="url(#neonCyan)" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="28">VP of Engineering @ NeuralStack</text>
    
    <text x="0" y="180" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" max-width="900">
      "Building resilient on-device foundation models for next-generation mobile hardware."
    </text>

    <!-- Date & Topic Pills -->
    <g transform="translate(0, 260)">
      <rect width="260" height="60" rx="14" fill="#141c33" stroke="#253561" stroke-width="1.5"/>
      <text x="30" y="38" fill="#38bdf8" font-family="'Space Mono', monospace" font-size="15">SATURDAY 11:00 AM</text>

      <rect x="290" y="0" width="260" height="60" rx="14" fill="#141c33" stroke="#253561" stroke-width="1.5"/>
      <text x="320" y="38" fill="#e2e8f0" font-family="'Space Mono', monospace" font-size="15">MAIN AUDITORIUM</text>
    </g>

    <!-- Swipe indicator -->
    <g transform="translate(760, 280)">
      <text x="0" y="20" fill="#64748b" font-family="'Space Mono', monospace" font-size="16">SWIPE NEXT</text>
      <path d="M 120 14 L 145 14 M 138 7 L 146 14 L 138 21" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
    </g>
  </g>
</svg>
