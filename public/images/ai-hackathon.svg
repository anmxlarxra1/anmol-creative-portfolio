<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a10"/>
      <stop offset="50%" stop-color="#120e24"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <linearGradient id="neonViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="sphereGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad)"/>

  <!-- Subtle Matrix / Coordinate Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="900"/>
    <line x1="300" y1="0" x2="300" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="900" y1="0" x2="900" y2="900"/>
    <line x1="1120" y1="0" x2="1120" y2="900"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="820" x2="1200" y2="820"/>
  </g>

  <!-- Geometric Glowing Mesh Sphere in Background -->
  <circle cx="850" cy="380" r="280" fill="url(#sphereGlow)" filter="url(#glowEffect)" opacity="0.6"/>
  <circle cx="850" cy="380" r="210" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>
  <circle cx="850" cy="380" r="140" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
  <ellipse cx="850" cy="380" rx="260" ry="90" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.6" transform="rotate(-25 850 380)"/>
  <ellipse cx="850" cy="380" rx="260" ry="90" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5" transform="rotate(35 850 380)"/>

  <!-- Corner Brackets -->
  <path d="M 80 120 L 80 80 L 120 80" stroke="#8b5cf6" stroke-width="3" fill="none"/>
  <path d="M 1120 120 L 1120 80 L 1080 80" stroke="#8b5cf6" stroke-width="3" fill="none"/>
  <path d="M 80 780 L 80 820 L 120 820" stroke="#8b5cf6" stroke-width="3" fill="none"/>
  <path d="M 1120 780 L 1120 820 L 1080 820" stroke="#8b5cf6" stroke-width="3" fill="none"/>

  <!-- Metadata Header -->
  <text x="80" y="115" fill="#a78bfa" font-family="'Space Mono', monospace" font-size="14" letter-spacing="4">CAMPUS HACKATHON // INITIATIVE 2026</text>
  <text x="1120" y="115" text-anchor="end" fill="#06b6d4" font-family="'Space Mono', monospace" font-size="14" letter-spacing="2">48 HOURS • $10,000 PRIZE POOL</text>

  <!-- Big Editorial Typography -->
  <text x="80" y="270" fill="#ffffff" font-family="'Syne', 'Arial Black', sans-serif" font-weight="800" font-size="100" letter-spacing="-2">INTELLIGENCE</text>
  <text x="80" y="370" fill="url(#neonViolet)" font-family="'Syne', 'Arial Black', sans-serif" font-weight="800" font-size="100" letter-spacing="-2">UNBOUND.</text>

  <!-- Concept Statement -->
  <text x="80" y="440" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" max-width="500">
    Building Autonomous Systems &amp; Next-Gen Human Interfaces.
  </text>
  <text x="80" y="475" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="18">
    A university-wide challenge uniting developers, designers, and visionaries.
  </text>

  <!-- Event Cards / Spec Badges -->
  <g transform="translate(80, 560)">
    <rect width="210" height="90" rx="12" fill="#14141e" stroke="#2a2a3e" stroke-width="1.5"/>
    <text x="24" y="36" fill="#64748b" font-family="'Space Mono', monospace" font-size="12">DATE &amp; VENUE</text>
    <text x="24" y="66" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18">OCT 24–26, 2026</text>
  </g>

  <g transform="translate(310, 560)">
    <rect width="210" height="90" rx="12" fill="#14141e" stroke="#2a2a3e" stroke-width="1.5"/>
    <text x="24" y="36" fill="#64748b" font-family="'Space Mono', monospace" font-size="12">TRACKS</text>
    <text x="24" y="66" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18">AI, iOS &amp; Web3</text>
  </g>

  <g transform="translate(540, 560)">
    <rect width="210" height="90" rx="12" fill="#14141e" stroke="#2a2a3e" stroke-width="1.5"/>
    <text x="24" y="36" fill="#64748b" font-family="'Space Mono', monospace" font-size="12">ELIGIBILITY</text>
    <text x="24" y="66" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18">All Students</text>
  </g>

  <!-- Footer Info & Barcode Decor -->
  <line x1="80" y1="720" x2="1120" y2="720" stroke="#242436" stroke-width="1"/>
  <text x="80" y="775" fill="#64748b" font-family="'Space Mono', monospace" font-size="14">ORG: CORE TECH TEAM &amp; GRAPHICS WING</text>
  <text x="80" y="805" fill="#475569" font-family="'Space Mono', monospace" font-size="12">SCAN TO REGISTER: APP.TECHSUMMIT.EDU/AI26</text>

  <!-- Barcode decoration -->
  <g transform="translate(980, 740)" fill="#8b5cf6" opacity="0.8">
    <rect x="0" y="0" width="3" height="45"/>
    <rect x="6" y="0" width="6" height="45"/>
    <rect x="16" y="0" width="2" height="45"/>
    <rect x="22" y="0" width="8" height="45"/>
    <rect x="34" y="0" width="4" height="45"/>
    <rect x="42" y="0" width="3" height="45"/>
    <rect x="49" y="0" width="7" height="45"/>
    <rect x="60" y="0" width="2" height="45"/>
    <rect x="66" y="0" width="5" height="45"/>
    <rect x="75" y="0" width="8" height="45"/>
    <rect x="87" y="0" width="4" height="45"/>
    <rect x="95" y="0" width="2" height="45"/>
    <rect x="101" y="0" width="7" height="45"/>
    <rect x="112" y="0" width="3" height="45"/>
  </g>
</svg>
