<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bytesBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#121324"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bytesBg)"/>

  <g transform="translate(80, 100)">
    <text x="0" y="40" fill="#10b981" font-family="'Space Mono', monospace" font-size="16" letter-spacing="4">DESIGN BYTES // EPISODE #04</text>
    
    <text x="0" y="140" fill="#ffffff" font-family="'Syne', sans-serif" font-weight="800" font-size="64">Mastering Contrast</text>
    <text x="0" y="200" fill="#a5b4fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="24">3 Golden Rules for Dark Mode Typography</text>

    <!-- Contrast comparison cards -->
    <g transform="translate(0, 270)">
      <!-- Bad card -->
      <rect width="430" height="420" rx="20" fill="#181824" stroke="#ef4444" stroke-width="1.5"/>
      <text x="40" y="60" fill="#ef4444" font-family="'Space Mono', monospace" font-size="14">❌ AVOID: PURE BLACK &amp; WHITE</text>
      <text x="40" y="110" fill="#ffffff" font-weight="800" font-size="28">Harsh High Glare</text>
      <text x="40" y="150" fill="#ffffff" font-size="16" max-width="350">
        100% white (#FFFFFF) on pure pitch black (#000000) causes chromatic aberration and visual eye fatigue.
      </text>
      <rect x="40" y="240" width="350" height="120" rx="12" fill="#000000"/>
      <text x="60" y="310" fill="#ffffff" font-size="20">Hard on human eyes</text>
    </g>

    <g transform="translate(480, 270)">
      <!-- Good card -->
      <rect width="430" height="420" rx="20" fill="#181824" stroke="#10b981" stroke-width="1.5"/>
      <text x="40" y="60" fill="#10b981" font-family="'Space Mono', monospace" font-size="14">✅ RECOMMENDED: SOFT OFF-WHITE</text>
      <text x="40" y="110" fill="#f4f4f7" font-weight="800" font-size="28">Warm Editorial Tone</text>
      <text x="40" y="150" fill="#cbd5e1" font-size="16" max-width="350">
        Using #F4F4F7 on charcoal #0A0A0E gives luxurious magazine-grade legibility with zero eye strain.
      </text>
      <rect x="40" y="240" width="350" height="120" rx="12" fill="#0e0e13" stroke="#232332"/>
      <text x="60" y="310" fill="#f4f4f7" font-size="20">Crisp &amp; Comfortable</text>
    </g>

    <!-- Footer -->
    <text x="0" y="770" fill="#64748b" font-family="'Space Mono', monospace" font-size="15">SAVED FOR QUICK REFERENCE • SHARE WITH FELLOW CREATIVES</text>
  </g>
</svg>
