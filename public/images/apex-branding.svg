<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="apexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b0f"/>
      <stop offset="50%" stop-color="#14111f"/>
      <stop offset="100%" stop-color="#08080c"/>
    </linearGradient>
    <linearGradient id="apexGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#apexBg)"/>

  <!-- Geometric monogram mark in center-left -->
  <g transform="translate(250, 420)">
    <!-- Outer hexagon contour -->
    <polygon points="0,-180 156,-90 156,90 0,180 -156,90 -156,-90" fill="none" stroke="#2e2a42" stroke-width="2" stroke-dasharray="6 6"/>
    <!-- Apex geometric A/Arrow -->
    <path d="M 0 -130 L 110 80 L 50 80 L 0 -20 L -50 80 L -110 80 Z" fill="url(#apexGrad)"/>
    <polygon points="0,-70 35,0 -35,0" fill="#0b0b0f"/>
    <!-- Floating point -->
    <circle cx="0" cy="-145" r="7" fill="#c084fc"/>
  </g>

  <!-- Typography and Identity presentation -->
  <g transform="translate(560, 260)">
    <rect width="130" height="32" rx="6" fill="#201a35" stroke="#4c3875" stroke-width="1"/>
    <text x="18" y="21" fill="#c084fc" font-family="'Space Mono', monospace" font-size="12">BRAND IDENTITY</text>

    <text x="0" y="110" fill="#ffffff" font-family="'Syne', sans-serif" font-weight="800" font-size="64" letter-spacing="-1">APEX LAB</text>
    <text x="0" y="155" fill="#a78bfa" font-family="'Space Mono', monospace" font-size="16" letter-spacing="4">CREATIVE MULTIMEDIA COLLECTIVE</text>

    <text x="0" y="220" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" max-width="500">
      A minimalist brand mark built on mathematical precision. The letter "A" fused with an upward delta arrow portrays ambition, creative elevation, and design curiosity.
    </text>

    <!-- Color Swatches Row -->
    <g transform="translate(0, 310)">
      <circle cx="20" cy="20" r="20" fill="#0b0b0f" stroke="#333" stroke-width="2"/>
      <circle cx="80" cy="20" r="20" fill="#7c3aed"/>
      <circle cx="140" cy="20" r="20" fill="#a78bfa"/>
      <circle cx="200" cy="20" r="20" fill="#f8fafc"/>
      <text x="240" y="25" fill="#64748b" font-family="'Space Mono', monospace" font-size="13">Primary Palette (Dark Obsidian, Royal Violet, Lavender, Off-White)</text>
    </g>
  </g>
</svg>
